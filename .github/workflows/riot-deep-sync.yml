name: Riot Deep SoloQ Sync

on:
  workflow_dispatch:
    inputs:
      match_count:
        description: "Recent ranked games per player (max 100)"
        required: false
        default: "100"
  schedule:
    # Nightly incremental sync at 09:00 UTC (04:00 EST)
    - cron: "0 9 * * *"

jobs:
  deep-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run incremental Riot deep sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DEEP_SYNC_MATCH_COUNT: ${{ github.event.inputs.match_count || '100' }}
        run: node scripts/riot-deep-sync.mjs
