name: Riot Deep SoloQ Sync

on:
  workflow_dispatch:
    inputs:
      match_count:
        description: "Recent ranked games per player (max 200)"
        required: false
        default: "200"
  schedule:
    # Nightly incremental sync at 09:00 UTC (04:00 EST)
    - cron: "0 9 * * *"

jobs:
  deep-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run incremental Riot deep sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DEEP_SYNC_MATCH_COUNT: ${{ github.event.inputs.match_count || '200' }}
        run: node scripts/riot-deep-sync.mjs
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord notification."
            exit 0
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **Riot Deep SoloQ Sync failed** — likely an expired \`RIOT_API_KEY\`. Refresh at <https://developer.riotgames.com/> and update the \`RIOT_API_KEY\` repo secret.\\nRun: $RUN_URL\"}"
